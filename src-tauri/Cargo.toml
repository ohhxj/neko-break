[package]
name = "mac-break-reminder"
version = "0.1.2"
edition = "2021"

[lib]
name = "mac_break_reminder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-opener = "2.0.0"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSResponder", "NSView", "NSWindow"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVAnimation", "AVPlayer", "AVPlayerItem", "AVPlayerLayer", "AVPlayerLooper", "objc2-core-media", "objc2-quartz-core"] }
objc2-core-media = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["std", "NSURL"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CATransaction"] }
